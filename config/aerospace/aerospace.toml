# Reference: https://nikitabobko.github.io/AeroSpace/guide
# Commands:  https://nikitabobko.github.io/AeroSpace/commands

config-version = 2

after-startup-command = [
    # JankyBorders detects an already-running instance, so this is safe on config reload
    'exec-and-forget borders active_color=0xff39ff14 inactive_color=0x00000000 width=5.0'
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when the focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# Workspaces that stay alive even when empty
persistent-workspaces = ["1", "2", "3", "4", "5"]

on-mode-changed = []

# Force Neovide windows into the tiling layer (they can register as floating).
[[on-window-detected]]
    if.app-id = 'com.neovide.neovide'
    run = 'layout tiling'

[workspace-to-monitor-force-assignment]
    1 = "secondary"
    2 = "secondary"
    3 = "secondary"
    4 = "secondary"
    # 5 lives on the laptop. It must stay in persistent-workspaces, otherwise it is
    # garbage collected while empty and AeroSpace invents a stub workspace (8) instead.
    5 = "main"

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0

[mode.main.binding]
    alt-f = 'layout floating tiling'
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

    alt-leftSquareBracket = 'workspace prev --wrap-around'
    alt-rightSquareBracket = 'workspace next --wrap-around'

    alt-shift-leftSquareBracket = 'move-node-to-workspace prev --wrap-around'
    alt-shift-rightSquareBracket = 'move-node-to-workspace next --wrap-around'

    cmd-h = [] # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
