[package]
name = "pi-transcript"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pi-transcript"
path = "src/main.rs"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
