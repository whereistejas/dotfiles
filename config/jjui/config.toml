[ui]
theme = "gruvbox-light"

[diff]
wrap = false

[preview]
wrap = false

[[bindings]]
action = "revisions.refresh"
key = "super+r"
scope = "revisions"
desc = "refresh"

[[bindings]]
action = "revisions.details.refresh"
key = "super+r"
scope = "revisions.details"
desc = "refresh"

[[actions]]
name = "semantic-diff"
desc = "semantic diff (difftastic)"
key = "shift+d"
scope = "revisions"
lua = '''
local id = context.change_id()
if not id then
  return
end
local out, err = jj("diff", "-r", id, "--tool", "difft")
if err then
  flash({ text = err, error = true })
  return
end
diff.show(out)
'''

[[actions]]
name = "semantic-diff-file"
desc = "semantic file diff (difftastic)"
key = "shift+d"
scope = "revisions.details"
lua = '''
local id = context.change_id()
local file = context.file()
if not id or not file then
  return
end
local files = context.checked_files()
if #files == 0 then
  files = { file }
end
local args = { "diff", "-r", id, "--tool", "difft" }
for _, f in ipairs(files) do
  table.insert(args, f)
end
local out, err = jj(args)
if err then
  flash({ text = err, error = true })
  return
end
diff.show(out)
'''

[[actions]]
name = "edit-file"
desc = "open file in neovim at first changed line"
key = "e"
scope = "revisions.details"
lua = '''
local id = context.change_id()
local file = context.file()
if not id or not file then
  return
end

local root, root_err = jj("root")
if root_err then
  flash({ text = root_err, error = true })
  return
end

-- Line of the first hunk in the new file; falls back to the top of the file
-- for renames, binaries and anything without a hunk header.
local line = 1
local diff = jj("diff", "--git", "-r", id, file)
if diff then
  for l in diff:gmatch("[^\n]+") do
    if l:sub(1, 3) == "@@ " then
      line = tonumber(l:match("%+(%d+)")) or 1
      break
    end
  end
end

local path = root:gsub("%s+$", "") .. "/" .. file
local quoted = "'" .. path:gsub("'", "'\\''") .. "'"

-- Inside a neovim terminal $NVIM is the parent session's socket, so hand the
-- file to it instead of nesting a second editor.
exec_shell(string.format(
  'if [ -n "$NVIM" ]; then '
    .. 'nvim --server "$NVIM" --remote-tab-silent %s && '
    .. 'nvim --server "$NVIM" --remote-send "<C-\\><C-N>:%d<CR>zz"; '
    .. 'else nvim +%d %s; fi',
  quoted, line, line, quoted
))
'''

[[actions]]
name = "copy-change-id"
desc = "copy change id to clipboard"
key = "shift+c"
scope = "revisions"
lua = '''
local id = context.change_id()
if id then
  id = id:sub(1, 8)
  copy_to_clipboard(id)
  flash("Copied: " .. id)
end
'''
