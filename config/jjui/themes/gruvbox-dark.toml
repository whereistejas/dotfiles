# Gruvbox Dark for jjui
#
# Colors are lifted verbatim from ellisonleao/gruvbox.nvim (`background = "dark"`,
# normal contrast), so jjui matches Neovim. Palette slots used below:
#
#   bg0 #282828  bg1 #3c3836  bg2 #504945  bg3 #665c54  bg4 #7c6f64
#   fg1 #ebdbb2  fg2 #d5c4a1  fg3 #bdae93  fg4 #a89984  gray #928374
#   red #fb4934  green #b8bb26  yellow #fabd2f  blue #83a598
#   purple #d3869b  aqua #8ec07c  orange #fe8019
#
# Highlight-group anchors: Normal (fg1/bg0), NormalFloat (fg1/bg1),
# Pmenu (fg1/bg2), PmenuSel (bg2 on blue), StatusLine (fg1/bg2),
# WinSeparator (bg3), Comment (gray), Title (green bold), Search (yellow).
#
# Row cursors use bg2 rather than nvim's Visual (bg3 #665c54): rows are painted
# with jj's own ANSI colors and bg2 keeps them legible while still reading as a
# distinct highlight against bg0. Swap to bg1 #3c3836 for a fainter row.
#
# This file is the palette-slot mirror of gruvbox-light.toml: every selector is
# identical, only the slot values differ. A custom theme is self-contained --
# jjui does not fall back to its built-in theme for unset selectors.

[colors]

# --- Global roles -----------------------------------------------------------
"text"          = { fg = "#ebdbb2", bg = "#282828" }   # Normal
"dimmed"        = { fg = "#928374" }                   # Comment
":selected"     = { bg = "#504945", bold = true }      # between CursorLine/Visual
"border"        = { fg = "#665c54" }                   # WinSeparator
"title"         = { fg = "#b8bb26", bold = true }      # Title / Directory
"shortcut"      = { fg = "#fe8019" }                   # Special
"matched"       = { fg = "#fabd2f", bold = true }      # Search
"success"       = { fg = "#b8bb26", bold = true }
"error"         = { fg = "#fb4934", bold = true }      # WarningMsg
"source_marker" = { fg = "#282828", bg = "#8ec07c", bold = true }
"target_marker" = { fg = "#282828", bg = "#fb4934", bold = true }

# --- jj value roles (mirror jj's own colors.* defaults) ---------------------
"change_id"     = { fg = "#d3869b" }   # jj: magenta
"commit_id"     = { fg = "#83a598" }   # jj: blue
"bookmark"      = { fg = "#d3869b" }   # jj: magenta
"conflict"      = { fg = "#fb4934", bold = true }
# these also define the `added` / `modified` / `deleted` / `renamed` / `copied`
# roles used by the Details file list
"diff added"    = { fg = "#b8bb26" }
"diff modified" = { fg = "#fabd2f" }
"diff removed"  = { fg = "#fb4934" }
"diff renamed"  = { fg = "#83a598" }
"diff copied"   = { fg = "#8ec07c" }

# --- Revset bar and completion popup (Pmenu / PmenuSel) ---------------------
"revset title"                         = { fg = "#83a598", bg = "#3c3836", bold = true }
"revset text"                          = { fg = "#ebdbb2", bold = true }
"revset completion"                    = { fg = "#ebdbb2", bg = "#504945" }
"revset completion text"               = { fg = "#ebdbb2" }
"revset completion dimmed"             = { fg = "#a89984" }
"revset completion matched"            = { fg = "#fabd2f", bold = true, underline = true }
"revset completion:selected"           = { fg = "#504945", bg = "#83a598", bold = true }
"revset completion text:selected"      = { fg = "#504945" }
"revset completion dimmed:selected"    = { fg = "#665c54" }
"revset completion matched:selected"   = { fg = "#282828", bold = true, underline = true }

# --- Revisions list and Details ---------------------------------------------
"revisions"                           = { fg = "#ebdbb2" }
"revisions text"                      = { fg = "#ebdbb2" }
"revisions dimmed"                    = { fg = "#928374" }
"revisions matched"                   = { fg = "#fabd2f", bold = true }
"revisions:selected"                  = { bg = "#504945", bold = true }
"revisions details"                   = { fg = "#ebdbb2" }
"revisions details text"              = { fg = "#ebdbb2" }
"revisions details dimmed"            = { fg = "#a89984" }
"revisions details conflict"          = { fg = "#fb4934", bold = true }
"revisions details:selected"          = { bg = "#504945", bold = true }
"revisions details dimmed:selected"   = { fg = "#bdae93" }
"revisions rebase source_marker"      = { bold = true }
"revisions rebase target_marker"      = { bold = true }

# --- Oplog / Evolog ----------------------------------------------------------
"oplog"            = { fg = "#ebdbb2" }
"oplog text"       = { fg = "#ebdbb2" }
"oplog matched"    = { fg = "#fabd2f", bold = true }
"oplog:selected"   = { bg = "#504945", bold = true }
"evolog"           = { fg = "#ebdbb2" }
"evolog text"      = { fg = "#ebdbb2" }
"evolog dimmed"    = { fg = "#928374" }
"evolog change_id" = { fg = "#d3869b" }
"evolog commit_id" = { fg = "#83a598" }
"evolog:selected"  = { bg = "#504945", bold = true }

# --- Status bar (StatusLine) -------------------------------------------------
"status"          = { fg = "#ebdbb2", bg = "#504945" }
"status text"     = { fg = "#ebdbb2" }
"status title"    = { fg = "#504945", bg = "#83a598", bold = true }
"status shortcut" = { fg = "#fe8019" }
"status dimmed"   = { fg = "#bdae93" }

# --- Diff viewer and preview pane -------------------------------------------
"diff"           = { fg = "#ebdbb2", bg = "#282828" }
"preview"        = { fg = "#ebdbb2", bg = "#282828" }
"preview border" = { fg = "#665c54", bg = "#282828" }

# --- Help window (NormalFloat) -----------------------------------------------
"help"          = { fg = "#ebdbb2", bg = "#3c3836" }
