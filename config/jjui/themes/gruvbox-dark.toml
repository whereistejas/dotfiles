"bookmarks shortcut"          = { fg = "#fe8019" }
"bookmarks matched"           = { fg = "#fabd2f", bold = true }
"bookmarks:selected"          = { fg = "#504945", bg = "#83a598", bold = true }
"bookmarks text:selected"     = { fg = "#504945" }
"bookmarks dimmed:selected"   = { fg = "#665c54" }
