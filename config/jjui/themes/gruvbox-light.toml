# Gruvbox Light for jjui
#
# Colors are lifted verbatim from ellisonleao/gruvbox.nvim (`background = "light"`),
# so jjui matches Neovim. Palette slots used below:
#
#   bg0 #fbf1c7  bg1 #ebdbb2  bg2 #d5c4a1  bg3 #bdae93  bg4 #a89984
#   fg1 #3c3836  fg2 #504945  fg3 #665c54  fg4 #7c6f64  gray #928374
#   red #9d0006  green #79740e  yellow #b57614  blue #076678
#   purple #8f3f71  aqua #427b58  orange #af3a03
#
# Highlight-group anchors: Normal (fg1/bg0), NormalFloat (fg1/bg1),
# Pmenu (fg1/bg2), PmenuSel (bg2 on blue), StatusLine (fg1/bg2),
# WinSeparator (bg3), Comment (gray), Title (green bold), Search (yellow).
#
# Row cursors use bg2 rather than nvim's Visual (bg3 #bdae93): rows are painted
# with jj's own ANSI colors, and the dark ones (change_id magenta #8f3f71) drop
# to 3.1:1 contrast on bg3. bg2 lifts that to 3.9:1 while staying 1.5:1 against
# bg0. Swap to bg1 #ebdbb2 for 4.9:1 text contrast (exact CursorLine) if the row
# still reads too dark -- the tradeoff is a fainter 1.2:1 row highlight.
#
# A custom theme is self-contained: jjui does not fall back to its built-in
# theme for unset selectors, so every selector jjui looks up is listed here.

[colors]

# --- Global roles -----------------------------------------------------------
"text"          = { fg = "#3c3836", bg = "#fbf1c7" }   # Normal
"dimmed"        = { fg = "#928374" }                   # Comment
":selected"     = { bg = "#d5c4a1", bold = true }      # between CursorLine/Visual
"border"        = { fg = "#bdae93" }                   # WinSeparator
"title"         = { fg = "#79740e", bold = true }      # Title / Directory
"shortcut"      = { fg = "#af3a03" }                   # Special
"matched"       = { fg = "#b57614", bold = true }      # Search
"success"       = { fg = "#79740e", bold = true }
"error"         = { fg = "#9d0006", bold = true }      # WarningMsg
"source_marker" = { fg = "#fbf1c7", bg = "#427b58", bold = true }
"target_marker" = { fg = "#fbf1c7", bg = "#9d0006", bold = true }

# --- jj value roles (mirror jj's own colors.* defaults) ---------------------
"change_id"     = { fg = "#8f3f71" }   # jj: magenta
"commit_id"     = { fg = "#076678" }   # jj: blue
"bookmark"      = { fg = "#8f3f71" }   # jj: magenta
"conflict"      = { fg = "#9d0006", bold = true }
# these also define the `added` / `modified` / `deleted` / `renamed` / `copied`
# roles used by the Details file list
"diff added"    = { fg = "#79740e" }
"diff modified" = { fg = "#b57614" }
"diff removed"  = { fg = "#9d0006" }
"diff renamed"  = { fg = "#076678" }
"diff copied"   = { fg = "#427b58" }

# --- Revset bar and completion popup (Pmenu / PmenuSel) ---------------------
"revset title"                         = { fg = "#076678", bg = "#ebdbb2", bold = true }
"revset text"                          = { fg = "#3c3836", bold = true }
"revset completion"                    = { fg = "#3c3836", bg = "#d5c4a1" }
"revset completion text"               = { fg = "#3c3836" }
"revset completion dimmed"             = { fg = "#7c6f64" }
"revset completion matched"            = { fg = "#b57614", bold = true, underline = true }
"revset completion:selected"           = { fg = "#d5c4a1", bg = "#076678", bold = true }
"revset completion text:selected"      = { fg = "#d5c4a1" }
"revset completion dimmed:selected"    = { fg = "#bdae93" }
"revset completion matched:selected"   = { fg = "#fbf1c7", bold = true, underline = true }

# --- Revisions list and Details ---------------------------------------------
"revisions"                           = { fg = "#3c3836" }
"revisions text"                      = { fg = "#3c3836" }
"revisions dimmed"                    = { fg = "#928374" }
"revisions matched"                   = { fg = "#b57614", bold = true }
"revisions:selected"                  = { bg = "#d5c4a1", bold = true }
"revisions details"                   = { fg = "#3c3836" }
"revisions details text"              = { fg = "#3c3836" }
"revisions details dimmed"            = { fg = "#7c6f64" }
"revisions details conflict"          = { fg = "#9d0006", bold = true }
"revisions details:selected"          = { bg = "#d5c4a1", bold = true }
"revisions details dimmed:selected"   = { fg = "#665c54" }
"revisions rebase source_marker"      = { bold = true }
"revisions rebase target_marker"      = { bold = true }

# --- Oplog / Evolog ----------------------------------------------------------
"oplog"            = { fg = "#3c3836" }
"oplog text"       = { fg = "#3c3836" }
"oplog matched"    = { fg = "#b57614", bold = true }
"oplog:selected"   = { bg = "#d5c4a1", bold = true }
"evolog"           = { fg = "#3c3836" }
"evolog text"      = { fg = "#3c3836" }
"evolog dimmed"    = { fg = "#928374" }
"evolog change_id" = { fg = "#8f3f71" }
"evolog commit_id" = { fg = "#076678" }
"evolog:selected"  = { bg = "#d5c4a1", bold = true }

# --- Status bar (StatusLine) -------------------------------------------------
"status"          = { fg = "#3c3836", bg = "#d5c4a1" }
"status text"     = { fg = "#3c3836" }
"status title"    = { fg = "#d5c4a1", bg = "#076678", bold = true }
"status shortcut" = { fg = "#af3a03" }
"status dimmed"   = { fg = "#665c54" }

# --- Diff viewer and preview pane -------------------------------------------
